enableSearch = true
since = 2014

description = "Go, backend & open-source infrastructure — Edmonton's tech meetup"

# Logo image
# logo = "favicon.svg"
footerLogo = "favicon.png"

# center logo on navbar
centerLogo = false # Set to "true" for centering or "false" for left aligned.

# sets the maximum number of lines per codeblock. The codeblock will however be scrollable and expandable.
codeMaxLines = 7

# disable showing line numbers by default. Switch to `true` if you'd rather have them on.
codeLineNumbers = false

# enable math notation. Switch to `true` to enable mathjax in your site.
enableMathNotation = false

# directory(s) where your articles are located
mainSections = ["meetup","workshop"] # see config details here https://gohugo.io/functions/where/#mainsections

# Label Non inline images on an article body
figurePositionShow = false # toggle on or off globally
# you can toggle this behaviour on or off on per page using the same variable inside your articles frontmatter
figurePositionLabel = "Figure" # the text before image number e.g Figure 1.0

# Set the collapsed mobile navigation to either appear from the left or the right
mobileNavigation = "right" # if you prefer right change to 'right'

numberOfTagsShown = 14

[author]
name = "Peter Preeper"

# Meeting schedule (used by the {{< location >}} shortcode).
# NOTE: move to the third Thursday is pending final confirmation with the venue.
meetingDay = "Third Thursday"
meetingTime = "6:00 pm"

# Comments are shown only on blog posts. To enable:
#   1. Turn on GitHub Discussions for edmontongo/edmontongo.org and create a
#      category for comments.
#   2. Install the giscus app (https://github.com/apps/giscus) on the repo.
#   3. Fill in giscusRepoId + giscusCategoryId below, then set giscus = true.
giscus = false
giscusRepo = "edmontongo/edmontongo.org"
giscusRepoId = ""
giscusCategory = "Announcements"
giscusCategoryId = ""
giscusMapping = "pathname"
giscusReactionsEnabled = "1"
giscusTheme = "dark-dimmed"
giscusLang = "en"
