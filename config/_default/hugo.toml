baseURL = "https://edmontongo.org/"
copyright = "Edmonton Go"
locale = "en"
title = "Edmonton Go"

DefaultContentLanguage = "en"
theme = "clarity"
enableRobotsTXT = true

[taxonomies]
category = "categories"
series = "series"
tag = "tags"

[outputs]
home = ["HTML", "RSS", "JSON"]

[pagination]
pagerSize = 4

[deployment]
[[deployment.matchers]]
cacheControl = "max-age=31536000, no-transform, public"
gzip = true
pattern = "^.+\\.(js|css|svg|ttf|woff2)$"

[[deployment.matchers]]
cacheControl = "max-age=31536000, no-transform, public"
gzip = false
pattern = "^.+\\.(png|jpg|gif|webp)$"

[[deployment.matchers]]
contentType = "application/xml"
gzip = true
pattern = "^sitemap\\.xml$"

[[deployment.matchers]]
gzip = true
pattern = "^.+\\.(html|xml|json)$"
